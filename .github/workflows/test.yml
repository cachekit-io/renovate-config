name: Test

# test/quarantine.mjs resolves default.json through the pinned Renovate's own code, so a preset edit or a
# Renovate bump (which Renovate proposes here itself) that reopens the release-age hold turns this red.
# main only takes changes through pull requests, so there is no push trigger.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test preset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The pinned Renovate requires Node ^24.11.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm test

      - run: npm run validate
